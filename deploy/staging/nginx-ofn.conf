# Fork only: OFN staging (ofn.hof-homann.de) - stage 1, HTTP only.
# TLS once the DNS record ofn.hof-homann.de -> 167.233.60.2 exists:
#   certbot --nginx -d ofn.hof-homann.de
# certbot adds the 443 block itself. nginx -t must never break on this machine (Shopware staging).
server {
    listen 80;
    listen [::]:80;
    server_name ofn.hof-homann.de;

    access_log /var/log/nginx/ofn-access.log;
    error_log  /var/log/nginx/ofn-error.log;

    root /opt/ofn/app/public;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Precompiled assets and packs straight from disk.
    location ~ ^/(assets|packs)/ {
        expires 7d;
        add_header Cache-Control public;
        try_files $uri =404;
    }

    location / {
        try_files $uri @ofn;
    }

    location @ofn {
        proxy_pass http://127.0.0.1:8150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
